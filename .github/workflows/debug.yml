name: Debug

on:
  push:

jobs:
  debug:
    runs-on: macos-14

    steps:
      - name: Dump runner context
        env:
          RUNNER_CONTEXT: ${{ toJson(runner) }}
        run: echo "$RUNNER_CONTEXT"

  debug-macos15:
    runs-on: macos-15

    steps:
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true 
     
